version: '3.8'

services:
  streamforge-engine:
    build: .
    container_name: streamforge_cluster
    ports:
      - "9102:9102"
    environment:
      - PYTHONUNBUFFERED=1
      - CLUSTER_ID=SF-PRD-EUS-01
      - PARTITIONS=32
      - WORKERS=4
    volumes:
      - rocksdb_data:/tmp/rocksdb_state
    restart: unless-stopped
    command: ["--mode=live", "--workers=4", "--partitions=32", "--metrics-port=9102"]

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: streamforge_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - streamforge-engine

volumes:
  rocksdb_data:
